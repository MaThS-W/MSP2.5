Events:
  transición:
    type: player_command
    conditions:
    - '%command% == /transición'
    - '%player_is_op% == yes'
    actions:
      default:
      - 'cancel_event: true'
      - 'to_all: title: 60;200;60;∀;none'
      - 'wait_ticks: 61'
      - 'console_command: effect give @a[gamemode=adventure] minecraft:hunger 3 255'
      - 'console_command: effect give @a[gamemode=adventure] minecraft:jump_boost
        10 137'
      - 'console_command: effect give @a[gamemode=adventure] minecraft:slowness 10
        255'
      - 'wait: 4'
      - 'console_command: effect give @a[gamemode=adventure] minecraft:hunger 3 255'
      - 'wait: 6'
      - 'console_command: effect give @a[gamemode=adventure] minecraft:saturation
        5 10'
  
  EsperarJugadores:
    type: repetitive
    repetitive_time: 20
    conditions:
    - '%server_online% > 15 execute default2'
    - '%server_online% >= 45 execute iniciando'
    actions:
      default:
      - 'actionbar: &fEsperando jugadores%animations_<appear>...</appear>% &l[&f%server_online%/45&l];0'
      default2:
      - 'actionbar: &fEsperando jugadores%animations_<appear>...</appear>% &l[&f%math_0:DOWN_{server_online}-2%/45&l];0'
      iniciando:
      - 'actionbar: &bIniciando en breve%animations_<appear>...</appear>% &f&l[&f%server_online%/45&l];0'
    enabled: false
  
  TimerSimple:
    type: call
    actions:
      default:
      - 'console_command: stimer set 00:00:59 none BLUE false "󏿿"'
      - 'console_command: stimer set 00:00:59 timer BLUE false "≭󏿠󏿻&c<MM:SS>󐀔񐥠"'
  
  TimerPrueba1:
    type: call
    actions:
      default:
      - 'console_command: stimer set 00:30:00 none1 BLUE false "󏿿"'
      - 'console_command: stimer set 00:30:00 prueba1 BLUE false "≭󏿠󏿻&b<MM:SS>󐀔񐥠"'
  
