  TimerPrueba2:
    type: call
    actions:
      default:
      - 'console_command: stimer set 00:30:00 none1 BLUE false "󏿿"'
      - 'console_command: stimer set 00:30:00 prueba1 BLUE false "≭󏿠󏿻&6<MM:SS>󐀔񐥠"'
  
  TimerPrueba3:
    type: call
    actions:
      default:
      - 'console_command: stimer set 00:02:59 none1 BLUE false "󏿿"'
      - 'console_command: stimer set 00:02:59 prueba3 BLUE false "≰󏿠󏿠󏿽󏿽񏚠<MM:SS>󐀠󐀎񐥠"'
  
  TitleEscondete:
    type: repetitive
    repetitive_time: 15
    actions:
      default:
      - 'actionbar: %animations_<flash>Ě</flash>%;0'
    enabled: false
  
  Portales:
    type: block_interact
    cooldown: 5
    conditions:
    - '%block% == DARK_OAK_PRESSURE_PLATE execute portal_p1'
    - '%block% == SPRUCE_PRESSURE_PLATE execute portal_p2'
    - '%block% == CRIMSON_PRESSURE_PLATE execute portal_p3'
    - '%action_type% == PHYSICAL'
    actions:
      default: []
      cooldown:
      - 'cancel_event: true'
      portal_p1:
      - 'playsound_resource_pack: portal_enter;0.1;1'
      - 'wait_ticks: 10'
      - 'title: 3;25;3;none;&b∄'
      - 'wait: 1'
      - 'teleport: world;358.5;-43;236.5;-90;0'
      portal_p2:
      - 'playsound_resource_pack: portal_enter;0.1;1'
      - 'wait_ticks: 10'
      - 'title: 3;25;3;none;&a∄'
      - 'wait: 1'
      - 'teleport: world;-148.99;-28;-626.5;180;0'
      portal_p3:
      - 'playsound_resource_pack: portal_enter;0.1;1'
      - 'wait_ticks: 10'
      - 'title: 3;25;3;none;∀'
      - 'wait: 1'
      - 'teleport: world;-234.5;128;596.5;0;90'

